# SAC (Soft Actor-Critic) configuration
algorithm: "sac"

# SAC specific parameters
sac:
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  target_update_interval: 1
  ent_coef: "auto"
  target_entropy: "auto"
  
# Network architecture
network:
  policy_network:
    hidden_sizes: [256, 256]
    activation: "relu"
  value_network:
    hidden_sizes: [256, 256]
    activation: "relu"
    
# Training settings
training:
  total_timesteps: 1000000
  eval_episodes: 10
  eval_freq: 25000
  
# Environment specific
env:
  normalize: true
  clip_actions: true