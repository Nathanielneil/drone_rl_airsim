# 改进奖励训练配置 (UE4厘米单位修正版)
# UE4中距离单位为厘米(cm)，所有数值已按此调整

experiment:
  experiment_name: "improved_rewards_sac_ue4_units"
  description: "改进奖励系统的SAC训练，使用正确的UE4厘米单位"
  save_dir: "experiments"
  model_save_dir: "models"
  checkpoint_frequency: 5000

# 算法配置
algorithm:
  algorithm_name: "sac"
  buffer_size: 150000
  buffer_size_gpu: 300000
  batch_size_gpu: 512
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  target_update_interval: 1
  ent_coef: "auto"
  target_entropy: "auto"
  learning_starts: 2000

# 训练配置
training:
  total_timesteps: 200000
  batch_size: 256
  learning_rate: 0.0003
  gamma: 0.99
  device: "auto"
  seed: 42

# 环境配置 (UE4厘米单位)
environment:
  # 基础连接
  host: "127.0.0.1"
  port: 41451
  vehicle_name: "Drone1"
  
  # 图像配置
  camera_name: "front_center"
  image_type: "DepthVis"
  image_width: 84
  image_height: 84
  
  # 环境限制 (厘米单位)
  max_episode_steps: 2000
  action_space_type: "continuous"
  max_velocity: 800.0              # 8米/秒 = 800厘米/秒
  max_altitude: 3000.0             # 30米 = 3000厘米
  min_altitude: -500.0             # -5米 = -500厘米
  takeoff_height: 300.0            # 3米 = 300厘米
  
  # ============ 改进的奖励参数 (厘米单位) ============
  reward_scale: 0.1
  
  # 1. 进度奖励
  progress_reward_scale: 8.0       # 增强前进动机
  progress_distance_threshold: 100.0  # 1米 = 100厘米 (有效前进距离)
  
  # 2. 安全奖励 (大幅改进)
  safe_distance_threshold: 400.0   # 4米 = 400厘米
  safety_reward_scale: 3.0
  near_miss_penalty: -1.5         # 轻微惩罚，而非严厉惩罚
  collision_penalty: -8.0          # 大幅降低！从-100降至-8
  
  # 3. 效率奖励
  time_penalty: -0.01
  velocity_reward_scale: 2.0
  altitude_reward_scale: 1.0
  hover_penalty: -0.5
  smooth_control_reward: 1.0       # 奖励平滑控制
  
  # 4. 探索奖励
  exploration_reward_scale: 1.5
  exploration_distance_threshold: 200.0  # 2米 = 200厘米
  
  # 5. 课程学习 (智能难度调整)
  curriculum_enabled: true
  difficulty_level: 1
  collision_forgiveness: 5         # 允许5次碰撞后才真正惩罚
  success_threshold: 0.7           # 70%成功率后提升难度
  
  # 6. 形状奖励
  distance_shaping: true
  velocity_shaping: true
  altitude_shaping: true
  
  # 7. 稳定性奖励
  stability_reward_scale: 0.5
  oscillation_penalty: -0.3       # 惩罚震荡
  
  # ============ 高级功能 ============
  # 自适应奖励
  adaptive_rewards: true
  reward_normalization: true
  
  # 动态难度
  dynamic_obstacles: false         # 暂时关闭动态障碍物
  weather_effects: false           # 暂时关闭天气效果
  
  # 安全配置 (厘米单位)
  emergency_landing_height: 50.0   # 0.5米 = 50厘米
  safe_zone_radius: 1000.0         # 10米 = 1000厘米

# GPU优化配置
gpu:
  mixed_precision: true
  enable_tf32: true
  enable_cudnn_benchmark: true
  memory_fraction: 0.8

# 日志配置
logging:
  tensorboard_log_dir: "logs/tensorboard"
  log_interval: 500
  eval_freq: 10000
  n_eval_episodes: 5
  save_best_model: true
  
  # 详细奖励组件日志
  log_reward_components: true
  log_curriculum_progress: true
  log_safety_metrics: true

# ============================================
# 改进效果预期:
# 1. 碰撞惩罚从-100降至-8 (92%减少)
# 2. 增强前进奖励和安全奖励
# 3. 课程学习自动调整难度
# 4. 平滑控制和稳定性奖励
# 5. 50%更快的收敛速度
# 6. 60%减少的碰撞率
# ============================================

# ============================================
# UE4单位换算参考 (厘米 → 米)
# ============================================
# 50cm = 0.5m     (紧急着陆高度)
# 100cm = 1m      (进度阈值)
# 200cm = 2m      (探索阈值)
# 300cm = 3m      (起飞高度)
# 400cm = 4m      (安全距离)
# 800cm = 8m      (最大速度)
# 1000cm = 10m    (安全区域半径)
# 3000cm = 30m    (最大高度)
# ============================================